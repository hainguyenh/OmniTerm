name: Test Gate

# Five jobs, not one per command. Every extra job re-clones, re-installs pnpm dependencies, and — for
# the Rust ones — starts from a cold cargo cache, so checks that share a toolchain are grouped and pay
# that setup once. The job *names* are the required status checks in the branch ruleset; renaming one
# means updating the ruleset in the same change or master becomes unmergeable.
#
# The `push: branches: [master]` trigger is not a duplicate of the pull_request run: a PR check is
# recorded against the merge-commit SHA, while Build & Release looks up a green run for the SHA that
# actually landed on master. Without this trigger a release has nothing to verify against.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      git_ref:
        description: Git ref to validate when called by another workflow
        required: false
        type: string
        default: ""

concurrency:
  group: test-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-static:
    name: JS — Lint, Types & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The zero-credential audit. It is also embedded in `pnpm test` for local runs, but CI states it
      # as its own step so a failure reads as "a password can be persisted" rather than "tests broke".
      - run: pnpm test:security
      # The pre-push hook runs these same checks locally. If that runner breaks, pushes stop being
      # screened and CI silently becomes the first line of defence again — so it is tested here.
      - run: node --test scripts/__tests__/pre-push-check.test.mjs

  js-tests:
    name: JS — Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The node:test suites over scripts/. `coverage:js` below is vitest only, so these would go
      # unrun if they were not named here.
      - run: pnpm test:quality
      # Instrumented vitest covers exactly what a bare `vitest run` would, so running both is paying
      # twice for one result.
      - name: Generate JavaScript and TypeScript coverage
        run: pnpm coverage:js
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-js
          path: coverage-js/
          if-no-files-found: error
          retention-days: 7

  # Lint only. The Rust test suite runs once, inside `rust-coverage`: `cargo llvm-cov` runs the same
  # `cargo test --workspace` test set (the workspace has no doctests), so a second plain run here only
  # doubled the time. The job keeps its name because it is a required status check in the ruleset.
  rust-checks:
    name: Rust — Clippy & Tests
    runs-on: ubuntu-latest
    env:
      # Debug info is not needed for linting, tests or LLVM coverage and dominates the target size.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      # The full workspace (IDE crates, Wasmtime, Tauri) fills the 14 GB runner disk once
      # instrumented, so drop preinstalled toolchains this repository never uses first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assets:generate
      - run: pnpm stage:plugins
      # The Ubuntu mirror has served these ~70 MB at 65 kB/s (17 minutes), so the downloaded .deb
      # files are kept per runner image. apt still installs from them, and fetches only what changed.
      - name: Cache Tauri system packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-tauri-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}
      - name: Install Tauri system dependencies
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt-archives"             libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          rm -f ~/apt-archives/lock
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-coverage:
    name: Rust — Coverage (llvm-cov)
    runs-on: ubuntu-latest
    env:
      # Debug info is not needed for linting, tests or LLVM coverage and dominates the target size.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      # The full workspace (IDE crates, Wasmtime, Tauri) fills the 14 GB runner disk once
      # instrumented, so drop preinstalled toolchains this repository never uses first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assets:generate
      - run: pnpm stage:plugins
      # The Ubuntu mirror has served these ~70 MB at 65 kB/s (17 minutes), so the downloaded .deb
      # files are kept per runner image. apt still installs from them, and fetches only what changed.
      - name: Cache Tauri system packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-tauri-xvfb-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}
      - name: Install Tauri system dependencies
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt-archives"             libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev xvfb xauth
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          rm -f ~/apt-archives/lock
      # LLVM branch instrumentation is nightly-only, and a nightly build cannot share the stable
      # cache, so this stays a separate job from `rust-checks`. The nightly is pinned: the cache key
      # includes the compiler version, so a floating `nightly` started every day from a cold build.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: llvm-tools-preview
      # The coverage script builds into a temp directory by default, which no cache step saw, so the
      # instrumented dependencies were rebuilt from scratch every run. Inside the workspace,
      # rust-cache keeps them (it drops the workspace's own crates before saving).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/coverage/llvm-cov-target
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate full-source Rust coverage
        # Tauri/Wry initializes GTK before the coverage-smoke setup hook can request exit.
        # A virtual X server lets the real binary boot in headless GitHub Actions.
        run: xvfb-run -a node scripts/run-rust-coverage.mjs
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/coverage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-rust
          path: coverage-rust/
          if-no-files-found: error
          retention-days: 7

  coverage-gate:
    name: Coverage — full source 85%
    needs: [js-tests, rust-coverage]
    if: ${{ !cancelled() && needs.js-tests.result == 'success' && needs.rust-coverage.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v6
        with:
          name: coverage-js
          path: artifacts/coverage-js
      - uses: actions/download-artifact@v6
        with:
          name: coverage-rust
          path: artifacts/coverage-rust
      - name: Summarize and enforce language plus combined coverage
        run: |
          node scripts/check-coverage.mjs \
            --js artifacts/coverage-js/coverage-summary.json \
            --rust artifacts/coverage-rust/coverage-summary.json \
            --rust-ide artifacts/coverage-rust/coverage-ide-summary.json \
            --threshold 85 \
            --branch-threshold 80 \
            --output coverage-final.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-final
          path: coverage-final.json
          if-no-files-found: error
          retention-days: 7
