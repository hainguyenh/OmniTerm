name: Test Gate

# Five jobs, not one per command. Every extra job re-clones, re-installs pnpm dependencies, and — for
# the Rust ones — starts from a cold cargo cache, so checks that share a toolchain are grouped and pay
# that setup once. The job *names* are the required status checks in the branch ruleset; renaming one
# means updating the ruleset in the same change or master becomes unmergeable.
#
# The `push: branches: [master]` trigger is not a duplicate of the pull_request run: a PR check is
# recorded against the merge-commit SHA, while Build & Release looks up a green run for the SHA that
# actually landed on master. Without this trigger a release has nothing to verify against.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      git_ref:
        description: Git ref to validate when called by another workflow
        required: false
        type: string
        default: ""

concurrency:
  group: test-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-static:
    name: JS — Lint, Types & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The zero-credential audit. It is also embedded in `pnpm test` for local runs, but CI states it
      # as its own step so a failure reads as "a password can be persisted" rather than "tests broke".
      - run: pnpm test:security
      # The pre-push hook runs these same checks locally. If that runner breaks, pushes stop being
      # screened and CI silently becomes the first line of defence again — so it is tested here.
      - run: node --test scripts/__tests__/pre-push-check.test.mjs

  js-tests:
    name: JS — Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The node:test suites over scripts/. `coverage:js` below is vitest only, so these would go
      # unrun if they were not named here.
      - run: pnpm test:quality
      # Instrumented vitest covers exactly what a bare `vitest run` would, so running both is paying
      # twice for one result.
      - name: Generate JavaScript and TypeScript coverage
        run: pnpm coverage:js
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-js
          path: coverage-js/
          if-no-files-found: error
          retention-days: 7

  # Clippy and the test suite share a toolchain and a target directory, so running them in one job
  # lets `cargo test` reuse what `clippy --all-targets` already built instead of compiling the
  # workspace from a cold cache on a second runner.
  rust-checks:
    name: Rust — Clippy & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assets:generate
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-coverage:
    name: Rust — Coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assets:generate
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev xvfb xauth
      # LLVM branch instrumentation is nightly-only, and a nightly build cannot share the stable
      # cache, so this stays a separate job from `rust-checks`.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate full-source Rust coverage
        # Tauri/Wry initializes GTK before the coverage-smoke setup hook can request exit.
        # A virtual X server lets the real binary boot in headless GitHub Actions.
        run: xvfb-run -a node scripts/run-rust-coverage.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-rust
          path: coverage-rust/
          if-no-files-found: error
          retention-days: 7

  coverage-gate:
    name: Coverage — full source 85%
    needs: [js-tests, rust-coverage]
    if: ${{ !cancelled() && needs.js-tests.result == 'success' && needs.rust-coverage.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v6
        with:
          name: coverage-js
          path: artifacts/coverage-js
      - uses: actions/download-artifact@v6
        with:
          name: coverage-rust
          path: artifacts/coverage-rust
      - name: Summarize and enforce language plus combined coverage
        run: |
          node scripts/check-coverage.mjs \
            --js artifacts/coverage-js/coverage-summary.json \
            --rust artifacts/coverage-rust/coverage-summary.json \
            --threshold 85 \
            --output coverage-final.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-final
          path: coverage-final.json
          if-no-files-found: error
          retention-days: 7
