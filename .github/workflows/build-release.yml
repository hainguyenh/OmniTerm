name: Build & Release

# Trigger on pushing tags with format v*.*.* (e.g. v1.0.0, v2.1.3) from the main branch only.
# Tags pushed from any other branch are rejected by the 'check-branch' guard step.
# Or manually via workflow_dispatch.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git branch, tag, or commit SHA to checkout (leave blank to build on GHA UI selected ref)"
        required: false
        default: ""
      version:
        description: "Release version. Use 'auto' to read version from package.json (e.g. 1.0.2), or type exact version like 'v1.0.2'. Leave blank to build only."
        required: false
        default: "auto"

permissions:
  contents: write # needed to create a Release and upload the installer

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Run full lint, test, LOC, and coverage gate
    uses: ./.github/workflows/test-gate.yml
    with:
      git_ref: ${{ inputs.git_ref || github.ref }}

  resolve-release-version:
    runs-on: windows-latest
    outputs:
      skip: ${{ steps.semver.outputs.skip }}
      tag: ${{ steps.semver.outputs.tag }}
      bare: ${{ steps.semver.outputs.bare }}

    steps:
      - name: Check out source code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Guard — tag must be on main branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch --no-tags origin master
          if git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "✅ Tag commit is on main — proceeding."
          else
            echo "❌ Tag commit is NOT on main. Aborting release."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve release version
        id: semver
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.git_ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $event = $env:EVENT_NAME
          $inputRef = $env:INPUT_REF
          $inputVersion = $env:INPUT_VERSION
          $refName = $env:GITHUB_REF_NAME

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkgVersion = $pkg.version.Trim()
          if ($pkgVersion -match '^v') { $pkgVersion = $pkgVersion.Substring(1) }
          $pkgTag = "v$pkgVersion"

          $tag = ""
          $skip = "false"

          if ($event -eq 'push') {
              $tag = $refName
              if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
                  throw "Tag push detected but '$tag' is not a valid release tag."
              }
              if ($tag -ne $pkgTag) {
                  throw "Tag push detected ($tag) but it does not match package.json version $pkgTag."
              }
              Write-Host "Tag push detected ($tag). package.json version matches."
          } else {
              $rawVersion = $inputVersion.Trim()
              if ($rawVersion -eq 'auto') {
                  $tag = $pkgTag
                  Write-Host "auto version: using version from package.json: $tag"
              } elseif (-not [string]::IsNullOrEmpty($rawVersion)) {
                  if ($rawVersion -match '^v') { $rawVersion = $rawVersion.Substring(1) }
                  $rawVersion = $rawVersion.Trim()
                  if ($rawVersion -notmatch '^\d+\.\d+\.\d+$') {
                      throw "Version '$rawVersion' is not a valid semver (X.Y.Z)."
                  }
                  $requestedTag = "v$rawVersion"
                  if ($requestedTag -ne $pkgTag) {
                      throw "Manual release version $requestedTag must match package.json version $pkgTag."
                  }
                  $tag = $requestedTag
                  Write-Host "manual version: using package.json-matched $tag"
              } else {
                  if ($refName -match '^v\d+\.\d+\.\d+$') {
                      $tag = $refName
                      if ($tag -ne $pkgTag) {
                          throw "Manual tag reference $tag must match package.json version $pkgTag."
                      }
                  } elseif ($inputRef -match '^v\d+\.\d+\.\d+$') {
                      $tag = $inputRef
                      if ($tag -ne $pkgTag) {
                          throw "Manual tag reference $tag must match package.json version $pkgTag."
                      }
                  } else {
                      $skip = "true"
                      Write-Host "No version supplied and no tag reference detected — build-only run (no Release)."
                  }
              }
          }

          if ($skip -eq "false") {
              if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
                  throw "Version '$tag' is not a valid semver (vX.Y.Z)."
              }
              "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "bare=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "tag=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "bare=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

  build-desktop-packages:
    name: Build Tauri release package
    needs: [quality-gate, resolve-release-version]
    runs-on: windows-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify MSVC linker
        shell: pwsh
        run: |
          if (-not (Get-Command link.exe -ErrorAction SilentlyContinue)) {
            throw 'MSVC link.exe was not found on the Tauri release runner.'
          }
          Get-Command link.exe

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      # package.json, tauri.conf.json and Cargo.toml each carry the version separately; a drift here
      # ships an installer whose filename and metadata disagree and nothing else would catch it.
      - name: Validate Tauri release metadata
        if: needs.resolve-release-version.outputs.skip != 'true'
        shell: pwsh
        env:
          BARE_VERSION: ${{ needs.resolve-release-version.outputs.bare }}
        run: node scripts/sync-tauri-version.mjs validate $env:BARE_VERSION

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri Windows setup installer
        run: pnpm build:tauri:nsis

      - name: Confirm Tauri setup artifact exists
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -File -ErrorAction SilentlyContinue)
          if ($nsis.Count -lt 1) { throw 'Tauri NSIS artifact was not produced.' }
          $nsis | Select-Object FullName, Length

      - name: Upload Tauri NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniTerm-Tauri-Windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  create-release-page:
    needs: [resolve-release-version, build-desktop-packages]
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download desktop release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: OmniTerm-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        # Only when a version was resolved (input wasn't blank).
        if: needs.resolve-release-version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release-version.outputs.tag }}
          name: ${{ needs.resolve-release-version.outputs.tag }}
          files: |
            release-artifacts/**/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
