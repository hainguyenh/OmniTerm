name: Build & Release

# Trigger on pushing tags with format v*.*.* (e.g. v1.0.0, v2.1.3) from the main branch only.
# Tags pushed from any other branch are rejected by the 'check-branch' guard step.
# Or manually via workflow_dispatch.
#
# Tags are the record of what shipped; master is never written to. A release used to commit the
# version bump back to master, which stopped working the moment master required pull requests — and
# a release opening its own PR would drag the whole gate through a second time. So the version is
# stamped into the artifacts at build time and the tag is what marks the commit. `package.json` is
# therefore a *floor*, not the released version: scripts/next-release-version.mjs resolves the next
# release from the highest shipped tag and only defers to package.json when it is higher still.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git branch, tag, or commit SHA to checkout (leave blank to build on GHA UI selected ref)"
        required: false
        default: ""
      version:
        description: "'auto' increments past the highest released tag. Or type an exact version like 'v1.0.2'. Leave blank to build only."
        required: false
        default: "auto"
      bump:
        description: "Which part 'auto' increments"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      force_quality_gate:
        description: "Run the full Test Gate instead of reusing the target commit's existing green run"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # needed to commit the version bump, push the tag, and create the Release

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Only when explicitly asked for: releasing a ref that never landed on master, or re-validating
  # after something outside the tree changed.
  quality-gate:
    name: Run full lint, test, LOC, and coverage gate
    if: ${{ inputs.force_quality_gate }}
    uses: ./.github/workflows/test-gate.yml
    with:
      git_ref: ${{ inputs.git_ref || github.ref }}

  # The commit being released has already been through the Test Gate — that is what the `push: master`
  # trigger in test-gate.yml is for. Re-running the whole gate, nightly llvm-cov and all, proves
  # nothing new about a tree that has not changed, so the release asks GitHub whether that run exists
  # and was green instead of paying for it a second time.
  verify-commit-is-green:
    name: Verify the target commit already passed the Test Gate
    if: ${{ !inputs.force_quality_gate }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Require a successful Test Gate run for this exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          RUNS=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/test-gate.yml/runs?head_sha=${SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$RUNS" -eq 0 ]; then
            echo "❌ No successful Test Gate run recorded for ${SHA}."
            echo "Release a commit that is on master and green, or re-run with force_quality_gate."
            exit 1
          fi
          echo "✅ Test Gate is green for ${SHA} (${RUNS} successful run(s))."

  resolve-release-version:
    runs-on: windows-latest
    outputs:
      skip: ${{ steps.semver.outputs.skip }}
      tag: ${{ steps.semver.outputs.tag }}
      bare: ${{ steps.semver.outputs.bare }}

    steps:
      - name: Check out source code with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Guard — tag must be on main branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch --no-tags origin master
          if git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "✅ Tag commit is on main — proceeding."
          else
            echo "❌ Tag commit is NOT on main. Aborting release."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # A manual run used to resolve its tag from package.json, so triggering with the defaults
      # re-resolved the version that was already released and overwrote that release's assets instead
      # of publishing a new one. 'auto' now means "move past the highest shipped tag".
      - name: Resolve release version
        id: semver
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          $event = $env:EVENT_NAME
          $inputVersion = $env:INPUT_VERSION
          $refName = $env:GITHUB_REF_NAME

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkgVersion = $pkg.version.Trim()
          if ($pkgVersion -match '^v') { $pkgVersion = $pkgVersion.Substring(1) }
          $pkgTag = "v$pkgVersion"

          $tag = ""
          $skip = "false"

          if ($event -eq 'push') {
              # A tag push publishes exactly the tag that was pushed. package.json is only a floor —
              # releases no longer write back to master, so it stays behind the shipped tags by
              # design. What must not happen is releasing *below* the floor, which would ship an
              # installer older than a version someone deliberately raised the repo to.
              $tag = $refName
              if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
                  throw "Tag push detected but '$tag' is not a valid release tag."
              }
              if ([version]$tag.Substring(1) -lt [version]$pkgVersion) {
                  throw "Tag push detected ($tag) but it is below the package.json floor version $pkgTag."
              }
              Write-Host "Tag push detected ($tag). At or above the package.json floor $pkgTag."
          } else {
              $rawVersion = $inputVersion.Trim()
              if ([string]::IsNullOrEmpty($rawVersion)) {
                  $skip = "true"
                  Write-Host "No version supplied — build-only run (no Release)."
              } elseif ($rawVersion -eq 'auto') {
                  $level = if ([string]::IsNullOrEmpty($env:INPUT_BUMP)) { 'patch' } else { $env:INPUT_BUMP }
                  # Exit code first: on failure the output is empty, and calling .Trim() on it would
                  # bury the script's own error message under a null-reference one.
                  $bare = node scripts/next-release-version.mjs $level
                  if ($LASTEXITCODE -ne 0) { throw "Could not resolve the next release version." }
                  $tag = "v$($bare.Trim())"
                  Write-Host "auto ($level): highest shipped tag increments to $tag"
              } else {
                  if ($rawVersion -match '^v') { $rawVersion = $rawVersion.Substring(1) }
                  $rawVersion = $rawVersion.Trim()
                  if ($rawVersion -notmatch '^\d+\.\d+\.\d+$') {
                      throw "Version '$rawVersion' is not a valid semver (X.Y.Z)."
                  }
                  $tag = "v$rawVersion"
                  Write-Host "manual version: $tag"
              }

              # The exact failure this workflow was reported for: a run that resolves an already
              # released tag silently replaces that release's assets rather than publishing a new one.
              if ($skip -eq "false" -and (git tag --list $tag)) {
                  throw "Tag $tag already exists. Releasing it again would overwrite the existing release's assets."
              }
          }

          if ($skip -eq "false") {
              if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
                  throw "Version '$tag' is not a valid semver (vX.Y.Z)."
              }
              "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "bare=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "tag=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "bare=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      # A manual release commits the bump back to master, so it has to be building a commit that is
      # already on master — otherwise the push would carry unrelated work along with the version.
      - name: Guard — a manual release must build from master
        if: github.event_name == 'workflow_dispatch' && steps.semver.outputs.skip != 'true'
        shell: bash
        run: |
          git fetch --no-tags origin master
          if git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "✅ Build commit is on master — proceeding."
          else
            echo "❌ Build commit is NOT on master, and a release commits its version bump to master."
            exit 1
          fi

  build-desktop-packages:
    name: Build Tauri release package (${{ matrix.platform.name }})
    needs: [quality-gate, verify-commit-is-green, resolve-release-version]
    if: >-
      ${{ !cancelled()
          && needs.resolve-release-version.result == 'success'
          && (needs.quality-gate.result == 'success' || needs.verify-commit-is-green.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.platform.target }}

      - name: Verify MSVC linker
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command link.exe -ErrorAction SilentlyContinue)) {
            throw 'MSVC link.exe was not found on the Tauri release runner.'
          }
          Get-Command link.exe

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp the release version
        if: needs.resolve-release-version.outputs.skip != 'true'
        shell: pwsh
        env:
          BARE_VERSION: ${{ needs.resolve-release-version.outputs.bare }}
        run: node scripts/sync-tauri-version.mjs write $env:BARE_VERSION

      - name: Validate Tauri release metadata
        shell: pwsh
        env:
          BARE_VERSION: ${{ needs.resolve-release-version.outputs.bare }}
        run: node scripts/sync-tauri-version.mjs validate $env:BARE_VERSION

      - name: Build bundled plugins
        run: |
          pnpm build:plugin plugins/always-awake
          pnpm build:plugin plugins/blur

      - name: Stage bundled plugin resources
        shell: pwsh
        run: |
          $pluginNames = @('always-awake', 'blur')
          foreach ($pluginName in $pluginNames) {
            $stage = Join-Path (Get-Location) ".omniterm-build/plugins/$pluginName"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item "plugins/$pluginName/package.json" $stage -Force
            Copy-Item "plugins/$pluginName/dist" $stage -Recurse -Force
          }
          $resources = @{
            'builtinThemes/*' = 'builtinThemes/'
            'sidecar/*.cjs' = 'sidecar/'
          }
          foreach ($pluginName in $pluginNames) {
            $resources["../.omniterm-build/plugins/$pluginName/package.json"] = "plugins/$pluginName/package.json"
            $resources["../.omniterm-build/plugins/$pluginName/dist/*"] = "plugins/$pluginName/dist/"
          }
          $config = @{ bundle = @{ resources = $resources } }
          $config | ConvertTo-Json -Depth 8 | Set-Content (Join-Path (Get-Location) '.omniterm-build/tauri.bundle-plugin.json')

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build Tauri Windows setup installer
        if: matrix.platform.os == 'windows-latest'
        run: pnpm build:tauri:nsis --config .omniterm-build/tauri.bundle-plugin.json

      - name: Build Tauri Linux & macOS packages
        if: matrix.platform.os != 'windows-latest'
        run: pnpm tauri:build --config .omniterm-build/tauri.bundle-plugin.json

      - name: Confirm Tauri setup artifact exists
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          $bundle = 'target/release/bundle/nsis'
          if (-not (Test-Path -LiteralPath $bundle -PathType Container)) {
            throw "Tauri produced no NSIS bundle directory at $bundle."
          }
          $nsis = @(Get-ChildItem -LiteralPath $bundle -Filter *.exe -File)
          if ($nsis.Count -lt 1) { throw "Tauri NSIS artifact was not produced in $bundle." }
          $nsis | Select-Object FullName, Length

      - name: Package portable app with bundled plugins
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          . ./scripts/ReleasePackaging.ps1
          $repoRoot = (Get-Location).Path
          $artifacts = Join-Path $repoRoot 'artifacts'
          $stage = Join-Path $repoRoot '.omniterm-build'
          New-Item -ItemType Directory -Force -Path (Join-Path $artifacts 'portable'), $stage | Out-Null

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $portable = New-PortablePackage `
            -RepoRoot $repoRoot `
            -Destination (Join-Path $artifacts 'portable') `
            -ArchiveName "OmniTerm_${version}_x64-portable.zip" `
            -Plugins @(
              @{ Name = 'always-awake'; Path = (Join-Path $repoRoot 'plugins/always-awake') },
              @{ Name = 'blur'; Path = (Join-Path $repoRoot 'plugins/blur') }
            )
          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) { throw "Missing $portable." }
          Get-Item -LiteralPath $portable | Select-Object FullName, Length

      - name: Upload Tauri NSIS artifact
        if: matrix.platform.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: OmniTerm-Tauri-Windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable artifact
        if: matrix.platform.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: OmniTerm-Windows-portable
          path: |
            artifacts/portable/*.exe
            artifacts/portable/*.exe.sha256
            artifacts/portable/*.zip
            artifacts/portable/*.zip.sha256
          if-no-files-found: error

      - name: Upload Linux desktop packages
        if: matrix.platform.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v6
        with:
          name: OmniTerm-Linux-packages
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload macOS desktop packages
        if: matrix.platform.os == 'macos-latest'
        uses: actions/upload-artifact@v6
        with:
          name: OmniTerm-macOS-packages
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  create-release-page:
    needs: [resolve-release-version, build-desktop-packages]
    if: >-
      ${{ !cancelled()
          && needs.resolve-release-version.result == 'success'
          && needs.build-desktop-packages.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Tag the release commit
        if: github.event_name == 'workflow_dispatch' && needs.resolve-release-version.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ needs.resolve-release-version.outputs.tag }}
        run: |
          git config user.name 'hainguyenh'
          git config user.email '8667952+hainguyenh@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Download desktop release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: OmniTerm-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate release notes table grouped by OS
        shell: bash
        env:
          TAG: ${{ needs.resolve-release-version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          cat << 'EOF' > generate-notes.mjs
          import { readdirSync, statSync, readFileSync, existsSync, writeFileSync } from 'node:fs';
          import { join, basename } from 'node:path';

          const tag = process.env.TAG || 'v0.0.0';
          const repo = process.env.REPO || 'hainguyenh/OmniTerm';
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;

          function extractChangelogSection(targetTag) {
            if (!existsSync('CHANGELOG.md')) return '';
            const content = readFileSync('CHANGELOG.md', 'utf8');
            const bareVersion = targetTag.replace(/^v/, '').trim();

            const lines = content.split(/\r?\n/);
            let capturing = false;
            let sectionLines = [];

            for (const line of lines) {
              const match = /^##\s+\[(.*?)\]/.exec(line);
              if (match) {
                const headingVer = match[1].trim().replace(/^v/, '');
                if (capturing) break;
                if (headingVer === bareVersion || headingVer === targetTag || headingVer === 'Unreleased') {
                  capturing = true;
                  continue;
                }
              } else if (capturing) {
                sectionLines.push(line);
              }
            }
            return sectionLines.join('\n').trim();
          }

          function getFiles(dir) {
            let results = [];
            for (const item of readdirSync(dir, { withFileTypes: true })) {
              const full = join(dir, item.name);
              if (item.isDirectory()) {
                results = results.concat(getFiles(full));
              } else if (item.isFile() && !item.name.endsWith('.sha256')) {
                results.push(full);
              }
            }
            return results;
          }

          function formatSize(bytes) {
            if (bytes >= 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
            if (bytes >= 1024) return `${(bytes / 1024).toFixed(2)} KB`;
            return `${bytes} B`;
          }

          let md = '';
          const changelog = extractChangelogSection(tag);
          if (changelog) {
            md += `## Changelog\n\n${changelog}\n\n`;
          }

          md += `## Downloads\n\n`;

          const files = getFiles('release-artifacts');
          const categorized = {
            windows: [],
            linux: [],
            macos: [],
          };

          for (const file of files) {
            const name = basename(file);
            const size = formatSize(statSync(file).size);
            const url = `${baseUrl}/${encodeURIComponent(name)}`;
            const link = `[\`${name}\`](${url})`;

            if (name.endsWith('.exe') || (name.endsWith('.zip') && name.includes('portable'))) {
              let desc = 'Windows Package';
              if (name.includes('setup') || name.includes('nsis')) desc = 'Installer (.exe)';
              else if (name.endsWith('.exe') && name.includes('portable')) desc = 'Portable (.exe)';
              else if (name.endsWith('.zip') && name.includes('portable')) desc = 'Portable (.zip)';
              categorized.windows.push({ link, desc, size });
            } else if (name.endsWith('.AppImage') || name.endsWith('.deb')) {
              let desc = name.endsWith('.AppImage') ? 'AppImage' : 'Debian / Ubuntu (.deb)';
              categorized.linux.push({ link, desc, size });
            } else if (name.endsWith('.dmg')) {
              categorized.macos.push({ link, desc: 'Disk Image (.dmg)', size });
            }
          }

          if (categorized.windows.length > 0) {
            md += `### Windows\n\n`;
            md += `| File | Description | Size |\n`;
            md += `| :--- | :--- | :--- |\n`;
            for (const item of categorized.windows) {
              md += `| ${item.link} | ${item.desc} | ${item.size} |\n`;
            }
            md += `\n`;
          }

          if (categorized.linux.length > 0) {
            md += `### Linux\n\n`;
            md += `| File | Description | Size |\n`;
            md += `| :--- | :--- | :--- |\n`;
            for (const item of categorized.linux) {
              md += `| ${item.link} | ${item.desc} | ${item.size} |\n`;
            }
            md += `\n`;
          }

          if (categorized.macos.length > 0) {
            md += `### macOS\n\n`;
            md += `| File | Description | Size |\n`;
            md += `| :--- | :--- | :--- |\n`;
            for (const item of categorized.macos) {
              md += `| ${item.link} | ${item.desc} | ${item.size} |\n`;
            }
            md += `\n`;
          }
          writeFileSync('release_notes.md', md, 'utf8');
          console.log('Generated release_notes.md:\n' + md);
          EOF
          node generate-notes.mjs

      - name: Publish GitHub release
        if: needs.resolve-release-version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release-version.outputs.tag }}
          name: ${{ needs.resolve-release-version.outputs.tag }}
          body_path: release_notes.md
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.exe.sha256
            release-artifacts/**/*.zip
            release-artifacts/**/*.zip.sha256
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.dmg
          fail_on_unmatched_files: true

