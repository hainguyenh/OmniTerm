[package]
name = "omniterm-session-protocol"
version = "0.1.4"
description = "Local session daemon protocol for OmniTerm."
authors = ["OmniTerm Contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "session_protocol"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
