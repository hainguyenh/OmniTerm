[package]
name = "omniterm-session-core"
version = "0.1.4"
description = "Persistent PTY daemon core for OmniTerm."
authors = ["OmniTerm Contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "session_core"
crate-type = ["lib"]

[dependencies]
omniterm-core = { path = "../app-core" }
omniterm-session-protocol = { path = "../session-protocol" }
portable-pty = "0.8"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
log = { version = "0.4", features = ["release_max_level_off"] }
dunce = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Storage_FileSystem"] }
