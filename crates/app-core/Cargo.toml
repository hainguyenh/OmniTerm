[package]
name = "omniterm-core"
version = "0.1.3"
description = "Domain logic + IO services for OmniTerm (no Tauri dependency)."
authors = ["OmniTerm Contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_core"
crate-type = ["lib"]

[dependencies]
omniterm-protocol = { path = "../app-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
dunce = "1"
log = { version = "0.4", features = ["release_max_level_off"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }
