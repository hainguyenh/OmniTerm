[package]
name = "omniterm-protocol"
version = "0.1.7"
description = "Shared DTO types for OmniTerm — frontend ↔ Tauri commands ↔ sidecar."
authors = ["OmniTerm Contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_protocol"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
